<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>

<body>
    <div class="container">
        <h1 class="title">Tic Tac Toe</h1>

        <div class="players">
            <h2 class="player1">Player 1</h2>
            <h2 class="player2">Player 2</h2>
        </div>

        <p class="comments"></p>

        <div class="board"></div>

        <div>
            <button class="reset btn" id="reset">RESTART</button>
        </div>

        <div>
            <button class="reset btn change-name" command="show-modal" commandfor="names-dialog">Change name</button>
        </div>

        <dialog id="names-dialog" closedby="any">
            <h2 class="dialog-title">New Names</h2>
            <div class="row">
                <label for="player1">Player 1</label>
                <input type="text" name="player1" id="player1" placeholder="Player 1">
            </div>
            <div class="row">
                <label for="player2">Player 2</label>
                <input type="text" name="player2" id="player2" placeholder="Player 2">
            </div>
            <div>
                <button class="btn reset" commandfor="names-dialog" command="close">Change</button>
            </div>
        </dialog>

    </div>
</body>

</html>
